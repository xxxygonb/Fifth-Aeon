<div class="lobby">
    <mat-card class="lobby-card">
        <mat-card-title>{{ 'Other' | tr }}</mat-card-title>
        <button mat-raised-button color="primary" (click)="client.openSettings()">
            <mat-icon>settings</mat-icon>
            <span> {{ 'Settings' | tr }}</span>
        </button>

        <a href="https://github.com/Fifth-Aeon/Fifth-Aeon-Wiki/wiki" target="_blank">
            <button mat-raised-button color="primary">
                <mat-icon>help</mat-icon>
                <span> {{ 'Help' | tr }} </span>
            </button>
        </a>

        <button routerLink="/upgradeAccount" *ngIf="user && user.role === 'guest'" mat-raised-button color="primary">
            <mat-icon>vertical_align_top</mat-icon>
            <span> {{ 'Upgrade to Full Account' | tr }} </span>
        </button>

        <button routerLink="/admin" *ngIf="user && user.role === 'admin'" mat-raised-button color="primary">
            <mat-icon>adb</mat-icon>
            <span> {{ 'Admin Panel' | tr }} </span>
        </button>

        <button mat-raised-button (click)="auth.logout()" color="primary">
            <mat-icon>cancel</mat-icon>
            <span> {{ 'Logout' | tr }}</span>
        </button>
    </mat-card>

    <div class="back-row">
        <button mat-raised-button routerLink="/lobby">
            <mat-icon>arrow_back</mat-icon>
            <span> {{ 'Back to Lobby' | tr }} </span>
        </button>
    </div>
</div>
