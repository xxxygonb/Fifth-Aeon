<svg class="resource-display">
    <rect
        [attr.x]="0"
        [attr.y]="10"
        width="60"
        height="30"
        fill="royalblue"
        rx="5"
        ry="5"
    />
    <text
        class="resource-text"
        [attr.x]="30"
        [attr.y]="(iconSize + 40) / 2"
        text-anchor="middle"
        matTooltipPosition="above"
        [matTooltip]="
            'You have {n} avalible energy out of {m} maxium energy. Play resources to increase your energy total.'
                | tr
                : {
                      n: resource.getNumeric(),
                      m: resource.getMaxNumeric()
                  }
        "
    >
        {{ resource.getNumeric() }}/{{ resource.getMaxNumeric() }}
    </text>
    <g
        *ngFor="let type of resourceTypes; let i = index"
        attr.transform="translate({{ 70 + (iconSize + padding) * i }} 0)"
        matTooltipPosition="above"
        [matTooltip]="
            'You have {n} {type}. Play a {type} resource to increase your {type}.'
                | tr
                : {
                      n: resource.getOfType(type.name),
                      type: typeName(type.name)
                  }
        "
    >
        <rect
            [attr.width]="iconSize + padding / 2"
            [attr.x]="-padding / 4"
            [attr.height]="50"
            rx="5"
            ry="5"
            [attr.fill]="type.color"
        />
        <image
            [attr.xlink:href]="type.icon"
            [attr.height]="iconSize"
            [attr.width]="iconSize"
        />
        <text
            class="resource-text"
            [attr.x]="iconSize / 2 + 2"
            [attr.y]="iconSize + 20"
            text-anchor="middle"
        >
            {{ resource.getOfType(type.name) }}
        </text>
    </g>
</svg>
