<mat-card>
    <mat-card-title>{{
        'Existing Mechanics (effects of this card)' | tr
    }}</mat-card-title>
    <mat-card-content>
        <p class="mechanic-hint" *ngIf="card.mechanics.length === 0">
            {{
                'No mechanics yet. Click the + button below to add one.' | tr
            }}
        </p>
        <table>
            <tbody>
                <tr *ngFor="let data of card.mechanics; let i = index">
                    <td>
                        <mat-form-field>
                            <mat-select
                                placeholder="{{ 'Mechanic (effect)' | tr }}"
                                panelClass="mechanic-select-panel"
                                [(ngModel)]="data.id"
                                (selectionChange)="changeMechanic(data, $event)"
                            >
                                <mat-option
                                    *ngFor="
                                        let constructor of mechanicList.getConstructors(
                                            card.cardType
                                        )
                                    "
                                    [value]="constructor.getId()"
                                    >{{ mechanicLabel(constructor.getId()) }}</mat-option
                                >
                            </mat-select>
                        </mat-form-field>
                    </td>
                    <td *ngIf="isTriggered(data)">
                        <mat-form-field>
                            <mat-select
                                placeholder="{{
                                    'Trigger (when it resolves)' | tr
                                }}"
                                panelClass="mechanic-select-panel"
                                [(ngModel)]="data.trigger.id"
                            >
                                <mat-option
                                    *ngFor="let id of getTriggerIds()"
                                    [value]="id"
                                    >{{ triggerLabel(id) }}</mat-option
                                >
                            </mat-select>
                        </mat-form-field>
                    </td>
                    <td *ngIf="isTargeted(data)">
                        <mat-form-field>
                            <mat-select
                                placeholder="{{ 'Target (who it affects)' | tr }}"
                                panelClass="mechanic-select-panel"
                                [(ngModel)]="data.targeter.id"
                            >
                                <mat-option value="Host"
                                    >{{ 'Use the card target' | tr }}</mat-option
                                >
                                <mat-option
                                    *ngFor="let id of getTargeterIds()"
                                    [value]="id"
                                    >{{ targeterLabel(id) }}</mat-option
                                >
                            </mat-select>
                        </mat-form-field>
                    </td>
                    <td
                        *ngFor="
                            let parameter of mechanicList.getParameters(data);
                            let i = index
                        "
                    >
                        <ccg-parameter-editor
                            [name]="parameter.name"
                            [type]="parameter.type"
                            [data]="data.parameters[i]"
                            (change)="setParam(data, i, $event)"
                        >
                        </ccg-parameter-editor>
                    </td>
                    <td>
                        <button
                            mat-icon-button
                            [disabled]="i === 0"
                            (click)="moveUp(i)"
                            matTooltip="{{
                                'Move up (effects resolve top to bottom)' | tr
                            }}"
                        >
                            <mat-icon>arrow_upward</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            [disabled]="i === card.mechanics.length - 1"
                            (click)="moveDown(i)"
                            matTooltip="{{
                                'Move down (effects resolve top to bottom)'
                                    | tr
                            }}"
                        >
                            <mat-icon>arrow_downward</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            color="warn"
                            (click)="delete(i)"
                            matTooltip="{{ 'Delete this mechanic' | tr }}"
                        >
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </mat-card-content>
    <mat-card-actions>
        <button
            mat-mini-fab
            color="primary"
            (click)="add()"
            matTooltip="{{ 'Add Mechanic' | tr }}"
        >
            <mat-icon>add</mat-icon>
        </button>
    </mat-card-actions>
</mat-card>
