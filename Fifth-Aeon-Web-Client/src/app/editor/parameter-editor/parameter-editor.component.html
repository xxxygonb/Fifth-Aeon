<ng-container [ngSwitch]="getEditorType()">
    <mat-form-field *ngSwitchCase="EditorType.Numeric">
        <input
            (change)="onChange($event)"
            [(ngModel)]="data"
            [placeholder]="name | tr"
            matInput
            [min]="getMin()"
            max="99"
            type="number"
        />
    </mat-form-field>

    <mat-form-field *ngSwitchCase="EditorType.Enumerable">
        <mat-select
            (selectionChange)="onChange($event)"
            [(ngModel)]="data"
            [placeholder]="name | tr"
        >
            <mat-option *ngFor="let item of getValues()" [value]="item.id">{{
                optionLabel(item)
            }}</mat-option>
        </mat-select>
    </mat-form-field>

    <!-- 卡牌类参数：搜索选择（后续卡牌会越来越多，不提供完整列表） -->
    <div class="card-search" *ngSwitchCase="EditorType.CardSearch">
        <span class="selected-card" *ngIf="selectedCardName()">
            {{ 'Selected: ' | tr }}{{ selectedCardName() }}
        </span>
        <input
            class="card-search-input"
            [ngModel]="searchKeyword"
            (ngModelChange)="onSearchChange($event)"
            [placeholder]="'Search cards by name' | tr"
            matInput
        />
        <ng-container *ngIf="searchKeyword.trim()">
            <div class="card-results">
                <span
                    class="card-result"
                    *ngFor="
                        let option of searchResults;
                        trackBy: trackOption
                    "
                    (click)="selectCard(option.id)"
                    >{{ option.name }}</span
                >
            </div>
            <span
                class="no-result"
                *ngIf="searchResults.length === 0"
                >{{ 'No matching cards' | tr }}</span
            >
        </ng-container>
    </div>

    <!-- 资源参数：能量 + 能量上限 + 四阵营需求，图形化编辑 -->
    <div class="resource-editor" *ngSwitchCase="EditorType.Resource">
        <div class="resource-grid">
            <mat-form-field class="resource-field">
                <mat-label>{{ 'Energy' | tr }}</mat-label>
                <input
                    matInput
                    type="number"
                    min="0"
                    max="99"
                    [ngModel]="getResourceField('energy')"
                    (ngModelChange)="setResourceField('energy', $event)"
                />
            </mat-form-field>
            <mat-form-field class="resource-field">
                <mat-label>{{ 'Max Energy' | tr }}</mat-label>
                <input
                    matInput
                    type="number"
                    min="0"
                    max="99"
                    [ngModel]="getResourceField('maxEnergy')"
                    (ngModelChange)="setResourceField('maxEnergy', $event)"
                />
            </mat-form-field>
            <mat-form-field
                class="resource-field"
                *ngFor="let resType of resourceTypes"
            >
                <mat-label>{{ resType | tr }}</mat-label>
                <input
                    matInput
                    type="number"
                    min="0"
                    max="99"
                    [ngModel]="getResourceField(resType.toLowerCase())"
                    (ngModelChange)="setResourceField(resType.toLowerCase(), $event)"
                />
            </mat-form-field>
        </div>
    </div>
</ng-container>
