<mat-form-field>
    <mat-select placeholder="{{ 'Targeter ID' | tr }}" [(ngModel)]="data.id">
        <mat-option *ngFor="let id of targeterList.getIds()" [value]="id">{{
            id | tr
        }}</mat-option>
    </mat-select>
</mat-form-field>
<mat-checkbox [(ngModel)]="data.optional">{{ 'Optional' | tr }}</mat-checkbox>
