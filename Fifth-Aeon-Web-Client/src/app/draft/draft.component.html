<div class="left">
    <mat-card id="card-selection">
        <mat-card-content id="editor-cards" #content>
            <ccg-card
                scale="1.75"
                *ngFor="let card of selectable"
                [card]="card"
                (click)="add(card)"
                noTranslate="true"
            ></ccg-card>
            <p class="record" *ngIf="draft && draft.canPlayGame()">
                你已取得 {{ draft.getWins() }} 胜
                {{ draft.getLosses() }} 负。
            </p>
            <div *ngIf="!draft">
                <p class="record">
                    花费 200 金币即可开启一局限制赛。
                </p>
                <p [hidden]="canBuy()">
                    但你目前的金币不足，可以通过进行普通对局来赚取金币。
                </p>
                <button
                    mat-raised-button
                    color="primary"
                    [disabled]="!canBuy()"
                    (click)="start()"
                >
                    开启限制赛
                </button>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card id="card-selection-controls">
        <mat-card-content>
            <button
                mat-fab
                matTooltipPosition="above"
                matTooltip="开始对局"
                color="primary"
                (click)="draftService.playGame()"
                [disabled]="!draft || !draft.canPlayGame()"
            >
                <mat-icon>check</mat-icon>
            </button>
            <button
                mat-fab
                matTooltipPosition="above"
                matTooltip="返回大厅"
                color="accent"
                routerLink="/lobby"
            >
                <mat-icon>undo</mat-icon>
            </button>
            <button
                mat-fab
                matTooltipPosition="above"
                matTooltip="放弃本次限制赛"
                color="warn"
                [disabled]="!draft || retired"
                (click)="retire()"
            >
                <mat-icon>cancel</mat-icon>
            </button>
        </mat-card-content>
    </mat-card>
</div>

<mat-card id="deck-list" *ngIf="deck">
    <mat-card-header>
        <mat-card-title>
            <h1>
                限制赛卡组 - {{ deck.size() }} /
                {{ format.minDeckSize }}
            </h1>
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-list>
            <mat-list-item *ngFor="let record of deck.getRecordList()">
                {{ record.card.getCost().asCost() }} -
                {{ record.card.getName() }} - ({{ record.number }})
            </mat-list-item>
        </mat-list>
    </mat-card-content>
</mat-card>
